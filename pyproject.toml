[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duplicati-mcp"
version = "0.1.0"
description = "MCP server for Duplicati backup management"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
duplicati-mcp = "duplicati_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/duplicati_mcp"]
