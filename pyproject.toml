[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duplicati-mcp"
version = "1.1.1"
description = "MCP server for Duplicati backup management"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "kcofoni", email = "kcofoni@gmail.com"},
]
keywords = ["mcp", "duplicati", "backup", "llm", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Archiving :: Backup",
    "Intended Audience :: System Administrators",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/kcofoni/duplicati-mcp"
Repository = "https://github.com/kcofoni/duplicati-mcp"
Issues = "https://github.com/kcofoni/duplicati-mcp/issues"

[project.scripts]
duplicati-mcp = "duplicati_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/duplicati_mcp"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
