version: '3.8'

services:
  duplicati-mcp:
    image: kcofoni/duplicati-mcp:latest
    # To build locally instead of using the Docker Hub image, comment out the line above and uncomment:
    # build: .
    container_name: duplicati-mcp-server
    ports:
      - "3000:3000"
    environment:
      # Point to your Duplicati instance — use the service name if on the same Docker network
      - DUPLICATI_URL=http://duplicati:8200
      - DUPLICATI_PASSWORD=
      # Set to "true" to disable run_backup, abort_backup, import_backup_config
      - DUPLICATI_READONLY=false
      # SQLite access (opt-in): uncomment and set the path to Duplicati-server.sqlite
      # inside this container (must match the volume mount point below).
      # - DUPLICATI_DB_PATH=/duplicati-config/Duplicati-server.sqlite
    # Uncomment the volumes section to enable SQLite access.
    # Option 1 — named volume (recommended, portable):
    # volumes:
    #   - duplicati_config:/duplicati-config:ro
    # Option 2 — bind mount (host path access, easier to debug):
    # volumes:
    #   - /srv/duplicati/config:/duplicati-config:ro
    restart: unless-stopped
    networks:
      - duplicati-network

networks:
  duplicati-network:
    driver: bridge

# Uncomment if using Option 1 (named volume) above.
# volumes:
#   duplicati_config:
